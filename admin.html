<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Admin · Nicole's Frost & Flour</title>
<style>
:root{--bg:#f3f8fc;--card:#fff;--ink:#12304a;--mute:#5d7589;--berry:#c2415d;--line:#d6e3ee;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;min-width:0;width:100%}
textarea{min-height:76px;resize:vertical}
button{border:0;border-radius:999px;padding:9px 16px;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;min-height:40px}
button.sec{background:#e4eef6;color:var(--ink)}button.del{background:transparent;color:var(--berry);padding:6px 10px}
button:disabled{opacity:.45;cursor:default}:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
#login{max-width:340px;margin:14vh auto;padding:0 20px}#login h1{margin:0 0 14px}#login form{display:grid;gap:10px}
.err{color:var(--berry);min-height:1.3em;margin:0}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px}
.top b{margin-right:6px}.top nav{display:flex;gap:6px;flex:1}.top nav button{background:rgba(255,255,255,.12);white-space:nowrap}.top nav button.on{background:#fff;color:var(--ink)}
.top a{color:#bfe0f5}#save{background:var(--berry)}#st{font-size:.9rem;color:#bfe0f5}
#ad{max-width:980px;margin:0 auto;padding:16px}
.tools{display:flex;gap:10px;margin-bottom:12px}
.sec1{background:var(--card);border-radius:14px;padding:14px;margin-bottom:16px;box-shadow:0 4px 14px rgba(18,48,74,.07)}
.sh{display:grid;grid-template-columns:1fr 1.2fr auto;gap:8px;margin-bottom:10px}.sh .t{font-weight:700}
.row{display:grid;grid-template-columns:2fr 1.2fr 110px auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.row.ph{grid-template-columns:48px 2fr 1.2fr 110px auto auto}.row.ph img{width:48px;height:48px;object-fit:cover;border-radius:8px}
.so{display:flex;gap:6px;align-items:center;white-space:nowrap;font-size:.9rem}.so input{width:auto}
.mv{display:flex;gap:2px}.mv button{padding:4px 9px;min-height:32px}
.rev{display:grid;grid-template-columns:1fr 1fr 110px;gap:8px;margin-bottom:8px}.rev textarea{grid-column:1/-1}
.rev .ft{grid-column:1/-1;display:flex;gap:10px;align-items:center;justify-content:space-between}
.hint{color:var(--mute);font-size:.9rem;margin:0 0 12px}
@media(max-width:700px){.sh,.row,.row.ph{grid-template-columns:1fr 1fr}.row>:first-child,.row.ph>:nth-child(2){grid-column:1/-1}.rev{grid-template-columns:1fr 1fr}.rev select{grid-column:1/-1}}
</style></head><body>
<div id="login"><h1>Admin</h1><form id="lf"><input id="em" type="email" autocomplete="username" aria-label="Admin email" placeholder="Admin email" required><input id="pw" type="password" autocomplete="current-password" aria-label="Password" placeholder="Password" required><button>Sign in</button><p class="err" id="le" role="alert"></p></form></div>
<div id="app" hidden>
<div class="top"><b>Frost &amp; Flour admin</b>
<nav><button data-tab="menu" class="on">Price list</button><button data-tab="photos">Photo cards</button><button data-tab="reviews">Testimonials</button></nav>
<span id="st" role="status"></span><button id="save" disabled>Save changes</button><a href="/" target="_blank" rel="noopener">View site</a><button class="sec" id="out">Sign out</button></div>
<main id="ad"></main></div>
<script src="config.js"></script>
<script src="menu-default.js"></script>
<script>
const $=s=>document.querySelector(s);
const dec=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};
const enc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ea=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
let S,tab='menu',dirty=false,ses=JSON.parse(sessionStorage.getItem('ffses')||'null');
const H=t=>({apikey:SB.key,'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{})});
const keep=j=>{ses={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in-60)*1000};sessionStorage.setItem('ffses',JSON.stringify(ses))};
async function auth(grant,body){const r=await fetch(SB.url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:H(),body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(grant==='password'?'Wrong email or password.':'Session expired. Please sign in again.');keep(j)}
async function token(){if(!ses)throw new Error('Please sign in again.');if(Date.now()>ses.exp){try{await auth('refresh_token',{refresh_token:ses.refresh})}catch(e){sessionStorage.removeItem('ffses');ses=null;throw e}}return ses.access}
async function isAdmin(){const r=await fetch(SB.url+'/rest/v1/rpc/is_admin',{method:'POST',headers:H(await token()),body:'{}'});return r.ok&&(await r.json())===true}
async function saveRemote(data){const r=await fetch(SB.url+'/rest/v1/site_data?on_conflict=id',{method:'POST',headers:{...H(await token()),Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{id:'main',data,updated_at:new Date().toISOString()}])});
 if(r.status===401||r.status===403)throw new Error('This account is not an admin. Add its email to the admin_users table.');
 if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||'Could not save.')}}
function load(rm){const sold=rm.sold||{};
 S={D:(rm.D||MENU0.D).map(([t,n,items])=>({t:dec(t),n:dec(n),items:items.map(x=>{const sub=typeof x[1]==='string';return{name:dec(x[0]),sub:sub?dec(x[1]):'',price:sub?x[2]:x[1],fl:!sub&&x[2]?x[2]:'',sold:!!sold[x[0]]}})})),
 G:(rm.G||MENU0.G).map(([n,s,p,src])=>({name:dec(n),sub:dec(s),price:dec(p),src,sold:!!sold[n]})),
 R:(rm.reviews||[]).map(r=>({name:r.name||'',product:r.product||'',text:r.text||'',stars:r.stars||5,show:r.show!==false}))}}
function out(){const sold={};
 const D=S.D.map(s=>[enc(s.t),enc(s.n),s.items.map(i=>{const nm=enc(i.name);if(i.sold)sold[nm]=1;const p=Number(i.price)||0;return i.sub?[nm,enc(i.sub),p]:i.fl?[nm,p,i.fl]:[nm,p]})]);
 const G=S.G.map(g=>{const nm=enc(g.name);if(g.sold)sold[nm]=1;return[nm,enc(g.sub),enc(g.price),g.src]});
 return{D,G,sold,reviews:S.R.filter(r=>r.text.trim())}}
const get=p=>p.split('.').reduce((o,k)=>o[k],S);
const inp=(p,v,ph,type='text',x='')=>`<input data-p="${p}" type="${type}" value="${ea(v)}" placeholder="${ph}" aria-label="${ph}" ${x}>`;
const chk=(p,v,l)=>`<label class="so"><input type="checkbox" data-p="${p}" ${v?'checked':''}> ${l}</label>`;
const mv=(a,i)=>`<span class="mv"><button class="sec" data-a="up" data-arr="${a}" data-i="${i}" aria-label="Move up">↑</button><button class="sec" data-a="dn" data-arr="${a}" data-i="${i}" aria-label="Move down">↓</button><button class="del" data-a="del" data-arr="${a}" data-i="${i}" aria-label="Delete">Delete</button></span>`;
function draw(){document.querySelectorAll('.top nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));let h='';
 if(tab==='menu'){h='<div class="tools"><input id="flt" type="search" placeholder="Filter items…" aria-label="Filter items"></div><p class="hint">Change a price, tick “Sold out” to grey an item out (customers can’t add it), or add/remove items and sections. Nothing goes live until you press Save changes.</p>'+
  S.D.map((s,si)=>`<section class="sec1"><div class="sh">${inp(`D.${si}.t`,s.t,'Section title','text','class="t"')}${inp(`D.${si}.n`,s.n,'Section note (optional)')}${mv('D',si)}</div>`+
  s.items.map((it,ii)=>`<div class="row">${inp(`D.${si}.items.${ii}.name`,it.name,'Item name')}${inp(`D.${si}.items.${ii}.sub`,it.sub,'Note (optional)')}<label class="so">₱${inp(`D.${si}.items.${ii}.price`,it.price,'Price','number','min="0" step="1" inputmode="numeric"')}</label>${chk(`D.${si}.items.${ii}.sold`,it.sold,'Sold out')}${mv(`D.${si}.items`,ii)}</div>`).join('')+
  `<button class="sec" data-a="additem" data-s="${si}" style="margin-top:8px">+ Add item</button></section>`).join('')+'<button class="sec" data-a="addsec">+ Add section</button>'}
 if(tab==='photos'){h='<p class="hint">Prices on the photo cards. Keep them in step with the price list. The photos themselves can’t be changed here.</p><div class="sec1">'+S.G.map((g,i)=>`<div class="row ph"><img src="img/t-${g.src.slice(4)}" alt="">${inp(`G.${i}.name`,g.name,'Name')}${inp(`G.${i}.sub`,g.sub,'Note (optional)')}${inp(`G.${i}.price`,g.price,'Price, e.g. ₱130')}${chk(`G.${i}.sold`,g.sold,'Sold out')}<span class="mv"><button class="del" data-a="del" data-arr="G" data-i="${i}">Hide</button></span></div>`).join('')+'</div>'}
 if(tab==='reviews'){h='<p class="hint">Testimonials show in a “What our customers say” section on the site. Untick “Show” to hide one without deleting it.</p>'+S.R.map((r,i)=>`<div class="sec1 rev">${inp(`R.${i}.name`,r.name,'Customer name')}${inp(`R.${i}.product`,r.product,'Product (optional)')}<select data-p="R.${i}.stars" aria-label="Stars">${[5,4,3,2,1].map(n=>`<option value="${n}"${n===+r.stars?' selected':''}>${'★'.repeat(n)}</option>`).join('')}</select><textarea data-p="R.${i}.text" placeholder="What the customer said" aria-label="Testimonial">${ea(r.text)}</textarea><div class="ft">${chk(`R.${i}.show`,r.show,'Show on site')}${mv('R',i)}</div></div>`).join('')+'<button class="sec" data-a="addrev">+ Add testimonial</button>'}
 $('#ad').innerHTML=h;const f=$('#flt');if(f)f.oninput=()=>{const v=f.value.toLowerCase();document.querySelectorAll('#ad .row').forEach(r=>{r.hidden=!!v&&![...r.querySelectorAll('input[type=text]')].some(i=>i.value.toLowerCase().includes(v))})}}
function mark(){dirty=true;$('#save').disabled=false;$('#st').textContent='Unsaved changes'}
document.addEventListener('input',e=>{const t=e.target,p=t.dataset.p;if(!p)return;const k=p.split('.'),l=k.pop();k.reduce((o,x)=>o[x],S)[l]=t.type==='checkbox'?t.checked:t.type==='number'?t.value:t.value;mark()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i,arr=b.dataset.arr&&get(b.dataset.arr.split('.').length>1?b.dataset.arr:b.dataset.arr);
 if(a==='del'){const n=arr[i].name||arr[i].t||'this';if(!confirm('Delete “'+(n||'this item')+'”?'))return;arr.splice(i,1)}
 else if(a==='up'&&i>0)[arr[i-1],arr[i]]=[arr[i],arr[i-1]];else if(a==='dn'&&i<arr.length-1)[arr[i+1],arr[i]]=[arr[i],arr[i+1]];
 else if(a==='additem')S.D[+b.dataset.s].items.push({name:'',sub:'',price:'',fl:'',sold:false});
 else if(a==='addsec')S.D.push({t:'New section',n:'',items:[]});
 else if(a==='addrev')S.R.unshift({name:'',product:'',text:'',stars:5,show:true});
 else if(!['up','dn'].includes(a))return;
 mark();draw()});
document.querySelector('.top nav').onclick=e=>{const t=e.target.dataset.tab;if(t){tab=t;draw()}};
$('#save').onclick=async()=>{const o=out();
 for(const s of o.D)for(const x of s[2]){if(!x[0].trim()){alert('An item in “'+s[0]+'” has no name.');return}const p=typeof x[1]==='string'?x[2]:x[1];if(!(p>0)){alert('“'+x[0]+'” needs a price above 0.');return}}
 $('#save').disabled=true;$('#st').textContent='Saving…';
 try{await saveRemote(o);dirty=false;$('#st').textContent='Saved ✓ live on the site now'}catch(e){$('#save').disabled=false;$('#st').textContent=e.message}};
window.onbeforeunload=()=>dirty?'':undefined;
$('#out').onclick=()=>{if(dirty&&!confirm('Discard unsaved changes?'))return;dirty=false;sessionStorage.removeItem('ffses');location.reload()};
async function boot(){let rm={};try{const r=await fetch(SB.url+'/rest/v1/site_data?id=eq.main&select=data',{headers:{...H(),'Cache-Control':'no-cache'}});if(r.ok){const rows=await r.json();rm=(rows[0]&&rows[0].data)||{}}}catch(e){}load(rm);$('#login').hidden=true;$('#app').hidden=false;draw()}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';try{await auth('password',{email:$('#em').value.trim(),password:$('#pw').value});if(await isAdmin())boot();else{sessionStorage.removeItem('ffses');ses=null;$('#le').textContent='Signed in, but this email is not an admin yet.'}}catch(x){$('#le').textContent=x.message}};
if(ses)isAdmin().then(ok=>ok?boot():sessionStorage.removeItem('ffses')).catch(()=>sessionStorage.removeItem('ffses'));
</script></body></html>
